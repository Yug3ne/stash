<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'"
    />
    <title>Stash</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="layout">
      <nav class="sidebar">
        <div class="brand">Stash</div>
        <!-- Filled in by app.js from the list of views -->
        <ul id="nav"></ul>
        <div class="sidebar-footer" id="system-summary"></div>
      </nav>

      <main>
        <section id="view"></section>

        <!-- Live output from whatever is running (installs, updates...) -->
        <section id="activity" class="activity collapsed">
          <header id="activity-header">
            <span class="activity-status" id="activity-status">Idle</span>
            <button class="ghost small" id="activity-toggle">Show log</button>
          </header>
          <pre id="activity-log"></pre>
        </section>
      </main>
    </div>

    <div id="toasts"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
